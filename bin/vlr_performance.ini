# ============================================================================
# VLR Wavefront 性能配置
# 
# 本文件包含渲染器核心的性能优化参数
# 这些参数影响GPU kernel的执行和内存管理
# 
# 用途: 库级别的性能调优，适用于所有场景
# ============================================================================

[Optimization]
# CPU-GPU同步间隔（深度数）
# 较大的值减少同步开销，但可能导致不必要的计算
# 推荐值: 4-8
SyncInterval = 4

# 路径压缩阈值 (0.0-1.0)
# 只在路径数下降超过此阈值时才执行压缩
# 推荐值: 0.70-0.80 (即路径数下降20-30%)
CompressionThreshold = 0.75

# 最小压缩路径数
# 当活跃路径数低于此值时，不执行压缩（开销大于收益）
# 推荐值: 1024-4096
MinPathsForCompression = 2048

# 是否启用路径排序（按材质分组）
# 减少BSDF评估时的分支发散
# 性能影响: +10-20% (多材质场景)
EnablePathSorting = true

# 是否启用流压缩（移除终止路径）
# 提高GPU占用率
# 性能影响: +5-10%
EnableStreamCompaction = true

# ============================================================================
# Kernel 线程块配置
# ============================================================================

[KernelConfig]
# GenerateRays kernel 的 block size
# 推荐值: 256 (16x16)
GenerateRaysBlockSize = 256

# ProcessHits kernel 的 block size
# 较小的值适合寄存器压力大的kernel
# 推荐值: 128-256
# Turing (RTX 20系列): 128
# Ampere/Ada (RTX 30/40系列): 256
ProcessHitsBlockSize = 128

# SampleLights kernel 的 block size
# 较大的值适合计算密集型kernel
# 推荐值: 128-256
# Turing: 128
# Ampere/Ada: 256
SampleLightsBlockSize = 256

# SampleBSDF kernel 的 block size
# 中等值平衡寄存器使用和occupancy
# 推荐值: 192-256
# Turing: 192
# Ampere/Ada: 256
SampleBSDFBlockSize = 192

# Accumulate kernel 的 block size
# 推荐值: 256
AccumulateBlockSize = 256

# ============================================================================
# 早期终止优化
# ============================================================================

[EarlyTermination]
# 是否启用早期终止
# 当大部分路径终止后，提前结束渲染
# 性能影响: +10-20%
# 注意: 最终渲染建议禁用以确保质量
EnableEarlyTermination = true

# 早期终止阈值 (0.0-1.0)
# 当活跃路径数低于此比例时，提前终止
# 推荐值: 0.01-0.05 (1-5%)
Threshold = 0.01

# 早期终止最小深度
# 只在深度大于此值时才考虑早期终止
# 推荐值: 10-15
MinDepth = 10

# ============================================================================
# 内存优化
# ============================================================================

[Memory]
# 是否使用 __restrict__ 指针优化
# 提示编译器指针不重叠，允许更激进的优化
# 性能影响: +5-10%
# 推荐: 始终启用
UseRestrictPointers = true

# 是否使用共享内存缓存材质数据
# 需要足够的shared memory，可能降低occupancy
# 性能影响: +5-15% (材质多时)
# Turing: false (shared memory有限)
# Ampere/Ada: true (更多shared memory)
UseMaterialCache = false

# 是否使用纹理内存缓存只读数据
# 提高缓存命中率
# 性能影响: +3-8%
UseTextureMemory = false

# ============================================================================
# 高级优化（实验性）
# ============================================================================

[Advanced]
# 是否使用CUDA Graphs
# 对于动态工作负载效果有限
# 推荐: false (Wavefront是动态的)
UseCudaGraphs = false

# 是否使用Warp级别操作优化
# 性能影响: +5-10%
# 推荐: true
UseWarpOptimizations = true

# 是否启用预取优化
# 实验性功能
UsePrefetching = false

# 是否使用融合kernel（减少启动开销）
# 合并ProcessHits和SampleLights
# 性能影响: +3-5%
UseFusedKernels = true

# 是否启用动态路径长度调整
# 未来功能
UseDynamicMaxDepth = false

# 是否启用自适应采样
# 未来功能
UseAdaptiveSampling = false

# ============================================================================
# 调试选项
# ============================================================================

[Debug]
# 是否启用NaN检测
# 开发阶段: true
# 生产环境: false
EnableNaNTracking = false

# 是否启用性能计数器
# 性能测试: true
# 正常使用: false
EnablePerfCounters = false

# 是否打印详细的kernel耗时
# 性能分析: true
# 正常使用: false
PrintKernelTiming = false

# 是否验证队列一致性
# 开发阶段: true
# 生产环境: false
ValidateQueues = false

# ============================================================================
# GPU设备配置
# ============================================================================

[Device]
# GPU设备ID (多GPU系统)
# 0 = 第一个GPU
DeviceID = 0

# 是否启用详细日志
VerboseLogging = true
