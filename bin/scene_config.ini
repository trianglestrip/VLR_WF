# ============================================================================
# VLR Wavefront 场景配置
# 
# 本文件包含测试场景的渲染参数
# 这些参数特定于测试程序（cornell_box_improved_test.exe等）
# 
# 用途: 场景级别的配置，不同场景使用不同配置
# ============================================================================

[Render]
# 图像分辨率
Width = 512
Height = 512

# 采样数 (samples per pixel)
# 推荐值: 
#   64-256   - 快速预览
#   512-1024 - 高质量
#   2048+    - 最终渲染
Samples = 64

# 最大路径深度
# 推荐值: 8-16
MaxDepth = 8

# 曝光补偿
# 推荐值: 0.5-2.0
Exposure = 1.0

# ============================================================================
# 输出配置
# ============================================================================

[Output]
# 输出文件名
Filename = cornell_box_improved.png

# 图像格式 (png, jpg, exr)
Format = png

# ============================================================================
# 相机配置
# ============================================================================

[Camera]
# 相机位置
PositionX = 0.0
PositionY = 1.5
PositionZ = 6.0

# 相机目标点
TargetX = 0.0
TargetY = 1.5
TargetZ = 0.0

# 视场角 (度)
# 推荐值: 30-60
FOV = 40.0

# 景深参数
# LensRadius = 0.0 表示针孔相机（无景深）
LensRadius = 0.0
FocusDistance = 1.0

# ============================================================================
# 场景特定参数（可选）
# ============================================================================

[Scene]
# 场景类型（用于文档说明）
# simple, medium, complex
SceneType = medium

# 场景描述
Description = Cornell Box with improved materials
