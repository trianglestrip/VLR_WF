# VLR_WF Render Configuration
# 渲染器配置文件

[Render]
# 图像分辨率
Width = 512
Height = 512

# 采样数 (samples per pixel)
# 推荐值: 64-256 (快速预览), 512-1024 (高质量), 2048+ (最终渲染)
Samples = 64

# 最大路径深度
MaxDepth = 8

# 曝光补偿
Exposure = 1.0

[Output]
# 输出文件名
Filename = cornell_box_improved.png

# 图像格式 (png, jpg, exr)
Format = png

[Camera]
# 相机位置
PositionX = 0.0
PositionY = 1.5
PositionZ = 6.0

# 相机目标点
TargetX = 0.0
TargetY = 1.5
TargetZ = 0.0

# 视场角 (度)
FOV = 40.0

# 景深参数
LensRadius = 0.0
FocusDistance = 1.0

[Performance]
# GPU设备ID (多GPU系统)
DeviceID = 0

# 是否启用详细日志
VerboseLogging = true

# ============================================================================
# Wavefront 性能优化参数
# ============================================================================

[Optimization]
# CPU-GPU同步间隔（深度数）
# 较大的值减少同步开销，但可能导致不必要的计算
# 推荐值: 4-8
SyncInterval = 4

# 路径压缩阈值 (0.0-1.0)
# 只在路径数下降超过此阈值时才执行压缩
# 推荐值: 0.70-0.80 (即路径数下降20-30%)
CompressionThreshold = 0.75

# 最小压缩路径数
# 当活跃路径数低于此值时，不执行压缩（开销大于收益）
# 推荐值: 1024-4096
MinPathsForCompression = 2048

# 是否启用路径排序（按材质分组）
# 减少BSDF评估时的分支发散
EnablePathSorting = true

# 是否启用流压缩（移除终止路径）
# 提高GPU占用率
EnableStreamCompaction = true

# ============================================================================
# Kernel 线程块配置
# ============================================================================

[KernelConfig]
# GenerateRays kernel 的 block size
# 推荐值: 256 (16x16)
GenerateRaysBlockSize = 256

# ProcessHits kernel 的 block size
# 较小的值适合寄存器压力大的kernel
# 推荐值: 128-256
ProcessHitsBlockSize = 128

# SampleLights kernel 的 block size
# 较大的值适合计算密集型kernel
# 推荐值: 128-256
SampleLightsBlockSize = 256

# SampleBSDF kernel 的 block size
# 中等值平衡寄存器使用和occupancy
# 推荐值: 192-256
SampleBSDFBlockSize = 192

# Accumulate kernel 的 block size
# 推荐值: 256
AccumulateBlockSize = 256

# ============================================================================
# 早期终止优化
# ============================================================================

[EarlyTermination]
# 是否启用早期终止
# 当大部分路径终止后，提前结束渲染
EnableEarlyTermination = true

# 早期终止阈值 (0.0-1.0)
# 当活跃路径数低于此比例时，提前终止
# 推荐值: 0.01-0.05 (1-5%)
Threshold = 0.01

# 早期终止最小深度
# 只在深度大于此值时才考虑早期终止
# 推荐值: 10-15
MinDepth = 10

# ============================================================================
# 内存优化
# ============================================================================

[Memory]
# 是否使用 __restrict__ 指针优化
# 提示编译器指针不重叠，允许更激进的优化
UseRestrictPointers = true

# 是否使用共享内存缓存材质数据
# 需要足够的shared memory，可能降低occupancy
UseMaterialCache = false

# 是否使用纹理内存缓存只读数据
# 提高缓存命中率
UseTextureMemory = false

# ============================================================================
# 高级优化（实验性）
# ============================================================================

[Advanced]
# 是否使用CUDA Graphs
# 对于动态工作负载效果有限
UseCudaGraphs = false

# 是否使用Warp级别操作优化
UseWarpOptimizations = true

# 是否启用预取优化
UsePrefetching = false

# 是否使用融合kernel（减少启动开销）
UseFusedKernels = true

# 是否启用动态路径长度调整
UseDynamicMaxDepth = false

# 是否启用自适应采样
UseAdaptiveSampling = false

# ============================================================================
# 调试选项
# ============================================================================

[Debug]
# 是否启用NaN检测
EnableNaNTracking = false

# 是否启用性能计数器
EnablePerfCounters = false

# 是否打印详细的kernel耗时
PrintKernelTiming = false

# 是否验证队列一致性
ValidateQueues = false
