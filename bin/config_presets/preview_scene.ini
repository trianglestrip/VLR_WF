# VLR_WF 快速预览 - 场景配置
# 用于快速迭代和场景调试

[Render]
Width = 512
Height = 512
Samples = 16        # 低采样，快速
MaxDepth = 4        # 低深度
Exposure = 1.0

[Output]
Filename = preview.png
Format = png

[Camera]
PositionX = 0.0
PositionY = 1.5
PositionZ = 6.0
TargetX = 0.0
TargetY = 1.5
TargetZ = 0.0
FOV = 40.0
LensRadius = 0.0
FocusDistance = 1.0

[Scene]
SceneType = simple
Description = Quick preview for scene debugging
