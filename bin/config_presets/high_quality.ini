# VLR_WF 高质量渲染配置
# 用于最终输出和照片级渲染

[Render]
Width = 1920
Height = 1080
Samples = 2048      # 高采样
MaxDepth = 16       # 高深度
Exposure = 1.0

[Output]
Filename = high_quality.png
Format = png

[Optimization]
SyncInterval = 4
CompressionThreshold = 0.70         # 更激进压缩
EnablePathSorting = true
EnableStreamCompaction = true

[KernelConfig]
GenerateRaysBlockSize = 256
ProcessHitsBlockSize = 128          # 小block（寄存器压力）
SampleLightsBlockSize = 128
SampleBSDFBlockSize = 192
AccumulateBlockSize = 256

[EarlyTermination]
EnableEarlyTermination = false      # 禁用（确保质量）
Threshold = 0.001
MinDepth = 14

[Memory]
UseRestrictPointers = true
UseMaterialCache = false
UseTextureMemory = false

[Advanced]
UseCudaGraphs = false
UseWarpOptimizations = true
UseFusedKernels = true

[Debug]
EnableNaNTracking = false
EnablePerfCounters = false
PrintKernelTiming = true            # 记录性能
ValidateQueues = false

[Performance]
DeviceID = 0
VerboseLogging = true
