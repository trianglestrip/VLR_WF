# VLR_WF 高采样测试 - 256 SPP + 轻度降噪
# 在透明度和降噪之间取得平衡

[Render]
Width = 1024
Height = 1024
Samples = 256        # 提高到 256 采样，减少原始噪点
MaxDepth = 8
Exposure = 1.2

[Output]
Filename = bin/cornell_256spp_denoise.png
Format = png

[Camera]
PositionX = 0.0
PositionY = 1.5
PositionZ = 6.0
TargetX = 0.0
TargetY = 1.5
TargetZ = 0.0
FOV = 40.0
LensRadius = 0.0
FocusDistance = 1.0

[Scene]
SceneType = simple
Description = High sample count with light denoising for glass transparency

[Denoiser]
Enabled = 1           # 启用降噪
UseAlbedo = 1         # 使用 Albedo guide layer
UseNormal = 1         # 使用 Normal guide layer
HDRIntensity = 1.0    # 标准 HDR 强度
