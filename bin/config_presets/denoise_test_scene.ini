# VLR_WF 降噪测试 - 场景配置
# 用于测试 OptiX 降噪器效果（低采样 + 降噪）

[Render]
Width = 1024
Height = 1024
Samples = 32          # 低采样（降噪前）
MaxDepth = 8
Exposure = 0.7

[Output]
Filename = denoise_test.png
Format = png

[Camera]
PositionX = 0.0
PositionY = 1.5
PositionZ = 6.0
TargetX = 0.0
TargetY = 1.5
TargetZ = 0.0
FOV = 40.0
LensRadius = 0.0
FocusDistance = 1.0

[Scene]
SceneType = simple
Description = Denoiser test with low samples

[Denoiser]
Enabled = 1           # 启用降噪
UseAlbedo = 1         # 使用 Albedo guide layer
UseNormal = 1         # 使用 Normal guide layer
HDRIntensity = 1.0    # HDR 强度
