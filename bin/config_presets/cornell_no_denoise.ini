# VLR_WF 测试 - 不使用降噪器
# 用于对比降噪器对玻璃透明度的影响

[Render]
Width = 1024
Height = 1024
Samples = 64
MaxDepth = 8
Exposure = 1.2

[Output]
Filename = bin/cornell_no_denoise.png
Format = png

[Camera]
PositionX = 0.0
PositionY = 1.5
PositionZ = 6.0
TargetX = 0.0
TargetY = 1.5
TargetZ = 0.0
FOV = 40.0
LensRadius = 0.0
FocusDistance = 1.0

[Scene]
SceneType = simple
Description = No denoiser for glass transparency comparison

[Denoiser]
Enabled = 0           # 禁用降噪
UseAlbedo = 1
UseNormal = 1
HDRIntensity = 1.0
