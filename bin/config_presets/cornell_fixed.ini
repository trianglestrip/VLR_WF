# VLR_WF 高质量测试 - 提高曝光
# 修复金属过暗和玻璃不够透明的问题

[Render]
Width = 1024
Height = 1024
Samples = 64          # 64 采样 + 降噪
MaxDepth = 8
Exposure = 1.2        # 提高曝光，让金属更亮

[Output]
Filename = bin/cornell_fixed.png
Format = png

[Camera]
PositionX = 0.0
PositionY = 1.5
PositionZ = 6.0
TargetX = 0.0
TargetY = 1.5
TargetZ = 0.0
FOV = 40.0
LensRadius = 0.0
FocusDistance = 1.0

[Scene]
SceneType = simple
Description = Fixed exposure for better material appearance

[Denoiser]
Enabled = 1           # 启用降噪
UseAlbedo = 1         # 使用 Albedo guide layer
UseNormal = 1         # 使用 Normal guide layer
HDRIntensity = 1.0    # HDR 强度
