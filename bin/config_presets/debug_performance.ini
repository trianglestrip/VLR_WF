# VLR_WF 调试 - 性能配置
# 优化目标: 便于调试，启用所有验证

[Optimization]
SyncInterval = 1                    # 每次都同步（精确控制）
CompressionThreshold = 0.75
MinPathsForCompression = 2048
EnablePathSorting = true
EnableStreamCompaction = true

[KernelConfig]
GenerateRaysBlockSize = 256
ProcessHitsBlockSize = 128
SampleLightsBlockSize = 128
SampleBSDFBlockSize = 128
AccumulateBlockSize = 256

[EarlyTermination]
EnableEarlyTermination = false      # 禁用（完整执行）
Threshold = 0.01
MinDepth = 10

[Memory]
UseRestrictPointers = true
UseMaterialCache = false
UseTextureMemory = false

[Advanced]
UseCudaGraphs = false
UseWarpOptimizations = true
UseFusedKernels = false             # 禁用融合（便于调试）
UseDynamicMaxDepth = false
UseAdaptiveSampling = false

[Debug]
EnableNaNTracking = true            # 启用NaN检测
EnablePerfCounters = true           # 启用性能计数
PrintKernelTiming = true            # 打印耗时
ValidateQueues = true               # 验证队列

[Device]
DeviceID = 0
VerboseLogging = true               # 详细日志
