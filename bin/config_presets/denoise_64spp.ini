# VLR_WF 降噪测试 - 64 samples
# 对比：64 samples + 降噪 vs 64 samples 无降噪

[Render]
Width = 1024
Height = 1024
Samples = 64          # 64 采样 + 降噪
MaxDepth = 8
Exposure = 0.5

[Output]
Filename = bin/denoised_64spp_optix.png
Format = png

[Camera]
PositionX = 0.0
PositionY = 1.5
PositionZ = 6.0
TargetX = 0.0
TargetY = 1.5
TargetZ = 0.0
FOV = 40.0
LensRadius = 0.0
FocusDistance = 1.0

[Scene]
SceneType = simple
Description = 64 samples with OptiX denoiser

[Denoiser]
Enabled = 1           # 启用降噪
UseAlbedo = 1         # 使用 Albedo guide layer
UseNormal = 1         # 使用 Normal guide layer
HDRIntensity = 1.0    # HDR 强度
